name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: daruks-services
  REGION: asia-northeast1
  SERVICE: amcg
  IMAGE: asia-northeast1-docker.pkg.dev/daruks-services/services/amcg

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/874588364576/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@daruks-services.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --service-account="amcg-server@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars=TZ=Asia/Tokyo \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --quiet
